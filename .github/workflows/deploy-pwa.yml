name: Deploy installable FotWeb
on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fotweb-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build FotWeb install icons
        run: |
          python -m pip install Pillow
          python pwa/make_icons.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload installable shell
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
