name: FotWeb hourly source checks
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fotweb-hourly-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official match pages and log actual execution
        run: python hourly_check.py
      - name: Commit real check log
        run: |
          git config user.name "fotweb-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/update-log.json
          if ! git diff --cached --quiet; then
            git commit -m "Log actual hourly source check"
            git push
          fi
