name: FotWeb hourly source checks
on:
  schedule:
    - cron: '13 * * * *'
  push:
    branches: [main]
    paths: [automated_update.py, stream_update.py, .github/workflows/hourly-check.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fotweb-data-updates
  cancel-in-progress: false
jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yt-dlp
      - name: Import and publish verified data with safe retries
        env:
          CHECK_KIND: hourly
        run: |
          git config user.name "fotweb-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            check_status=0
            python automated_update.py "$CHECK_KIND" || check_status=$?
            git add data/isl-results.json data/isl-season.json data/update-log.json
            if git diff --cached --quiet; then exit "$check_status"; fi
            git commit -m "Update verified ISL data and actual source check"
            if git push origin HEAD:main; then exit "$check_status"; fi
          done
          echo "Publication failed after three fresh-source attempts"
          exit 1
