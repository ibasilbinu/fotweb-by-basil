name: FotWeb hourly source checks
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fotweb-data-updates
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official match pages and log actual execution
        run: python automated_update.py
      - name: Commit verified match data and check log
        if: always()
        run: |
          git config user.name "fotweb-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/isl-results.json data/isl-season.json data/update-log.json
          if ! git diff --cached --quiet; then
            git commit -m "Log actual hourly source check"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
