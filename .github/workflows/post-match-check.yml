name: FotWeb post-match source checks
on:
  schedule:
    - cron: '*/10 10-17 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch:
    inputs:
      check_kind:
        description: "Post-match check"
        type: choice
        options:
          - post-match-early
          - post-match-late
        default: post-match-early
permissions:
  contents: write
concurrency:
  group: fotweb-data-updates
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and publish verified data with safe retries
        env:
          CHECK_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.check_kind || 'post-match-early' }}
        run: |
          git config user.name "fotweb-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            check_status=0
            python automated_update.py "$CHECK_KIND" || check_status=$?
            git add data/isl-results.json data/isl-season.json data/update-log.json
            if git diff --cached --quiet; then exit "$check_status"; fi
            git commit -m "Update verified ISL data and actual source check"
            if git push origin HEAD:main; then exit "$check_status"; fi
          done
          echo "Publication failed after three fresh-source attempts"
          exit 1
